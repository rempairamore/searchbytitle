<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Search By Title — OpenCitations</title>

<link href="bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<style>
:root{
    --paper:    #f5f6f8;
    --surface:  #ffffff;
    --ink:      #14171d;
    --muted:    #6b7280;
    --line:     #e7e9ef;
    --accent:   #1f6f78;
    --accent-ink:#0e4a51;
    --accent-weak:#e6f1f2;
    --radius:   16px;
}

*{ box-sizing:border-box; }

body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
}

/* ---------- Header ---------- */
.app-header{
    padding:48px 0 8px;
}
.eyebrow{
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:.72rem;
    font-weight:600;
    color:var(--accent);
    margin-bottom:.4rem;
}
.app-title{
    font-family:"Fraunces", Georgia, "Times New Roman", serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(2rem, 4vw, 3rem);
    line-height:1.05;
    letter-spacing:-.01em;
    margin:0;
}
.app-subtitle{
    color:var(--muted);
    margin-top:.5rem;
    font-size:1.02rem;
}

/* ---------- Search panel ---------- */
.search-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:0 1px 2px rgba(16,23,40,.04);
    display:flex;
    gap:10px;
    align-items:center;
}
.search-panel input{
    border:none;
    outline:none;
    background:transparent;
    font-size:1.05rem;
    padding:8px 12px;
    width:100%;
    color:var(--ink);
}
.search-panel input::placeholder{ color:#9aa1ad; }

.btn-accent{
    background:var(--accent);
    border:1px solid var(--accent);
    color:#fff;
    font-weight:600;
    padding:10px 22px;
    border-radius:12px;
    white-space:nowrap;
}
.btn-accent:hover,
.btn-accent:focus-visible{
    background:var(--accent-ink);
    border-color:var(--accent-ink);
    color:#fff;
}
.btn-accent:disabled{ opacity:.6; }

.btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    font-weight:500;
    padding:8px 16px;
    border-radius:12px;
}
.btn-ghost:hover{
    border-color:var(--accent);
    color:var(--accent-ink);
}

/* ---------- Results toolbar ---------- */
.results-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin:28px 0 18px;
}
.result-count strong{ color:var(--ink); }
.result-count{ color:var(--muted); font-size:.95rem; }
.page-info{
    color:var(--muted);
    font-size:.9rem;
    font-variant-numeric:tabular-nums;
}

/* ---------- Cards ---------- */
.product-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    height:100%;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    text-align:left;
    width:100%;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.product-card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 34px rgba(16,23,40,.10);
    border-color:#d4d8e2;
}
.product-card:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
}

.badge-type{
    align-self:flex-start;
    background:var(--accent-weak);
    color:var(--accent-ink);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.68rem;
    font-weight:600;
    padding:5px 10px;
    border-radius:999px;
    margin-bottom:14px;
}
.card-title{
    font-weight:600;
    font-size:1.06rem;
    line-height:1.35;
    margin:0 0 10px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}
.card-authors{
    color:var(--muted);
    font-size:.9rem;
    line-height:1.4;
    margin-bottom:16px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}
.card-meta{
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:auto;
    display:grid;
    gap:10px;
}
.meta-label{
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.66rem;
    font-weight:600;
    color:var(--muted);
    margin-bottom:2px;
}
.meta-value{ font-size:.9rem; }
.card-doi{
    margin-top:14px;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:.78rem;
    color:#8a90a0;
    word-break:break-all;
}

/* ---------- Skeleton ---------- */
.skel{
    background:linear-gradient(90deg,#edeff3 25%,#e2e5ec 37%,#edeff3 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
    border-radius:6px;
}
@keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }
@media (prefers-reduced-motion: reduce){ .skel{ animation:none; } .product-card{ transition:none; } }

.skel-badge{ width:84px; height:22px; border-radius:999px; margin-bottom:16px; }
.skel-line{ height:14px; margin-bottom:10px; }
.skel-line.w-90{ width:90%; }
.skel-line.w-70{ width:70%; }
.skel-line.w-50{ width:50%; }
.skel-block{ height:48px; margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }

/* ---------- States ---------- */
.empty-state{
    text-align:center;
    padding:64px 20px;
    color:var(--muted);
}
.empty-state .mark{ font-size:2.2rem; margin-bottom:.6rem; }

/* ---------- Pagination ---------- */
.pagination-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:40px 0 12px;
}
.btn-page{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-weight:500;
    padding:9px 20px;
    border-radius:12px;
}
.btn-page:hover:not(:disabled){
    border-color:var(--accent);
    color:var(--accent-ink);
}
.btn-page:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------- Modal ---------- */
.modal-content{ border:none; border-radius:var(--radius); }
.modal-body{ max-height:75vh; }
.modal-body pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:.82rem;
    background:#f7f8fa;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
}
.modal-body h5{ font-weight:600; margin-top:1.2rem; }
.modal-detail-title{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
}
</style>

</head>
<body>

<div class="container pb-5" style="max-width:1080px;">

    <header class="app-header">
        <div class="eyebrow">OpenCitations</div>
        <h1 class="app-title">Search By Title</h1>
    </header>

    <div class="search-panel mt-4">
        <input
            type="search"
            id="searchInput"
            placeholder="Search by title: OpenCitations, covid19, Cockatoos…"
            autocomplete="off"
            aria-label="Search papers by title">
        <button class="btn btn-accent" id="searchBtn" type="button">Search</button>
    </div>

    <!-- Toolbar (back + count) — hidden until a search runs -->
    <div class="results-toolbar d-none" id="resultsToolbar">
        <button class="btn btn-ghost" id="backBtn" type="button">← Back to search</button>
        <div class="d-flex align-items-center gap-3">
            <div class="result-count" id="resultCount"></div>
            <div class="page-info" id="pageInfo"></div>
        </div>
    </div>

    <div class="row g-4" id="productsContainer">
        <div class="col-12">
            <div class="empty-state">
                <div class="mark">🔍</div>
                Search for a paper by title to get started.<br>
                Try <strong>OpenCitations</strong>, <strong>covid19</strong> or <strong>Cockatoos</strong>.
            </div>
        </div>
    </div>

    <!-- Pagination — hidden until there are results -->
    <nav class="pagination-bar d-none" id="pagination" aria-label="Pagination">
        <button class="btn btn-page" id="prevBtn" type="button" disabled>← Previous</button>
        <button class="btn btn-page" id="nextBtn" type="button" disabled>Next →</button>
    </nav>

</div>

<!-- MODAL -->
<div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Product details</h5>
                <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>
</div>

<script src="bootstrap.bundle.min.js"></script>

<script>
"use strict";

const PAGE_SIZE = 9;

const els = {
    input:       document.getElementById('searchInput'),
    searchBtn:   document.getElementById('searchBtn'),
    toolbar:     document.getElementById('resultsToolbar'),
    backBtn:     document.getElementById('backBtn'),
    resultCount: document.getElementById('resultCount'),
    pageInfo:    document.getElementById('pageInfo'),
    container:   document.getElementById('productsContainer'),
    pagination:  document.getElementById('pagination'),
    prevBtn:     document.getElementById('prevBtn'),
    nextBtn:     document.getElementById('nextBtn'),
    modalContent:document.getElementById('modalContent'),
};

const modal = new bootstrap.Modal(document.getElementById('detailsModal'));

let currentPage = 1;
let currentSearchPattern = '';
let totalPages = 1;
let isLoading = false;

// Escape to avoid broken markup / XSS from API data.
function esc(value){
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
}

const getId = (p, scheme) => p?.identifiers?.find(i => i.scheme === scheme)?.value;
const getAuthors = (p, limit) => {
    const names = (p?.contributions || [])
        .filter(c => c.role === 'author')
        .map(c => c?.by?.name)
        .filter(Boolean);
    return limit ? names.slice(0, limit) : names;
};

// ---------- Events ----------
els.searchBtn.addEventListener('click', () => searchProducts(1));
els.backBtn.addEventListener('click', resetToSearch);
els.prevBtn.addEventListener('click', () => changePage(-1));
els.nextBtn.addEventListener('click', () => changePage(1));
els.input.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchProducts(1);
});

// ---------- Flow ----------
async function searchProducts(page = 1){

    const searchPattern = els.input.value.trim();
    if (!searchPattern){ els.input.focus(); return; }
    if (isLoading) return;

    currentSearchPattern = searchPattern;
    currentPage = page;

    showLoading();

    try{
        const url =
            `https://api-stg.opencitations.net/skg-if/v1/products?filter=cf.search.title:${encodeURIComponent(searchPattern)}`
            + `&page_size=${PAGE_SIZE}&page=${page}`;

        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        renderProducts(await response.json());
    }catch(error){
        console.error(error);
        showError();
    }finally{
        isLoading = false;
        els.searchBtn.disabled = false;
    }
}

function showLoading(){
    isLoading = true;
    els.searchBtn.disabled = true;
    els.toolbar.classList.remove('d-none');
    els.pagination.classList.add('d-none');
    els.resultCount.innerHTML = '';
    els.pageInfo.textContent = '';

    let html = '';
    for (let i = 0; i < PAGE_SIZE; i++){
        html += `
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="product-card" aria-hidden="true">
                    <div class="skel skel-badge"></div>
                    <div class="skel skel-line w-90"></div>
                    <div class="skel skel-line w-70"></div>
                    <div class="skel skel-line w-50"></div>
                    <div class="skel skel-block"></div>
                </div>
            </div>`;
    }
    els.container.innerHTML = html;
}

function showError(){
    els.pagination.classList.add('d-none');
    els.resultCount.innerHTML = '';
    els.pageInfo.textContent = '';
    els.container.innerHTML = `
        <div class="col-12">
            <div class="alert alert-danger mb-0">
                Couldn't load results. Try again.
            </div>
        </div>`;
}

function renderProducts(data){

    const products = data?.['@graph'] || [];
    const total = data?.meta?.part_of?.total_items ?? products.length;
    totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    els.toolbar.classList.remove('d-none');
    els.resultCount.innerHTML = `<strong>${total}</strong> results`;
    els.pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

    if (products.length === 0){
        els.pagination.classList.add('d-none');
        els.container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-warning mb-0">
                    No papers found for «${esc(currentSearchPattern)}». Try another title.
                </div>
            </div>`;
        return;
    }

    els.container.innerHTML = '';

    products.forEach(product => {
        const title = product?.titles?.none?.[0] || 'Untitled';
        const doi = getId(product, 'doi') || '—';
        const authors = getAuthors(product, 4).join(', ') || '—';
        const m = product?.manifestations?.[0] || {};
        const publicationDate = m?.dates?.publication?.[0] || '—';
        const venue = m?.biblio?.in?.name || '—';

        const col = document.createElement('div');
        col.className = 'col-12 col-sm-6 col-lg-4';
        col.innerHTML = `
            <button class="product-card" type="button">
                <span class="badge-type">${esc(product.product_type || 'unknown')}</span>
                <h2 class="card-title">${esc(title)}</h2>
                <div class="card-authors">${esc(authors)}</div>
                <div class="card-meta">
                    <div>
                        <div class="meta-label">Venue</div>
                        <div class="meta-value">${esc(venue)}</div>
                    </div>
                    <div>
                        <div class="meta-label">Published</div>
                        <div class="meta-value">${esc(publicationDate)}</div>
                    </div>
                    <div class="card-doi">DOI: ${esc(doi)}</div>
                </div>
            </button>`;

        col.firstElementChild.addEventListener('click', () => showDetails(product));
        els.container.appendChild(col);
    });

    // Pagination shown only when results are on screen.
    els.pagination.classList.remove('d-none');
    els.prevBtn.disabled = currentPage <= 1;
    els.nextBtn.disabled = currentPage >= totalPages || products.length < PAGE_SIZE;
}

function showDetails(product){
    const authors = getAuthors(product).map(esc).join('<br>') || '—';
    const doi = getId(product, 'doi') || '—';
    const m = product?.manifestations?.[0] || {};
    const b = m?.biblio || {};

    const doiHtml = doi !== '—'
        ? `<a href="https://doi.org/${encodeURIComponent(doi)}" target="_blank" rel="noopener">${esc(doi)}</a>`
        : '—';

    els.modalContent.innerHTML = `
        <h3 class="modal-detail-title mb-3">${esc(product?.titles?.none?.[0] || '')}</h3>
        <span class="badge-type">${esc(product.product_type || 'unknown')}</span>

        <h5>DOI</h5>
        <p>${doiHtml}</p>

        <h5>Authors</h5>
        <p>${authors}</p>

        <h5>Publication</h5>
        <table class="table table-bordered">
            <tr><th>Date</th><td>${esc(m?.dates?.publication?.[0] || '—')}</td></tr>
            <tr><th>Venue</th><td>${esc(b?.in?.name || '—')}</td></tr>
            <tr><th>Volume</th><td>${esc(b?.volume || '—')}</td></tr>
            <tr><th>Issue</th><td>${esc(b?.issue || '—')}</td></tr>
            <tr><th>Pages</th><td>${esc(b?.pages?.first || '—')} – ${esc(b?.pages?.last || '—')}</td></tr>
        </table>

        <h5>Raw JSON</h5>
        <pre>${esc(JSON.stringify(product, null, 2))}</pre>`;

    modal.show();
}

function changePage(direction){
    const nextPage = currentPage + direction;
    if (nextPage < 1 || nextPage > totalPages || !currentSearchPattern) return;
    searchProducts(nextPage);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetToSearch(){
    currentSearchPattern = '';
    currentPage = 1;
    totalPages = 1;
    els.input.value = '';
    els.toolbar.classList.add('d-none');
    els.pagination.classList.add('d-none');
    els.container.innerHTML = `
        <div class="col-12">
            <div class="empty-state">
                <div class="mark">🔍</div>
                Search for a paper by title to get started.<br>
                Try <strong>OpenCitations</strong>, <strong>covid19</strong> or <strong>Cockatoos</strong>.
            </div>
        </div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    els.input.focus();
}
</script>

</body>
</html>
